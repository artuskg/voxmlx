name: correctness-performance

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  correctness:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run contract correctness tests
        run: |
          python -m unittest discover -s tests -p 'test_*.py' -v

  performance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run contract microbenchmarks
        run: |
          python scripts/bench_contracts.py --iterations 20000 --output perf/current_contracts.json

      - name: Check perf regression (warn-only)
        run: |
          python scripts/check_perf_regression.py \
            --baseline perf/baseline_contracts.json \
            --current perf/current_contracts.json \
            --threshold 0.20 \
            --warn-only

      - name: Upload benchmark artifact
        uses: actions/upload-artifact@v4
        with:
          name: contract-benchmarks
          path: perf/current_contracts.json
